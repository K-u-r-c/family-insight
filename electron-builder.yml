appId: io.github.kurc.familyinsight
productName: Family Insight
copyright: Copyright © 2026 Jakub Kurc
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
artifactName: ${name}-${version}-${os}-${arch}.${ext}
extraResources:
  - from: build/icon.png
    to: icon.png
fileAssociations:
  - ext: finsight
    name: Family Insight Tree
    description: Family Insight family tree
    mimeType: application/x-family-insight
    role: Editor
  - ext: ged
    name: GEDCOM file
    description: GEDCOM family tree (imported by Family Insight)
    mimeType: application/x-gedcom
    role: Viewer
publish:
  provider: github
  owner: K-u-r-c
  repo: family-insight
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  multiLanguageInstaller: true
  installerLanguages:
    - en_US
    - pl_PL
    - de_DE
    - fr_FR
    - es_ES
    - it_IT
    - pt_BR
  createStartMenuShortcut: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Family Insight
  artifactName: ${name}-${version}-setup.${ext}
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  icon: build/icon.icns
  category: public.app-category.lifestyle
  target:
    - target: dmg
      arch: [x64, arm64]
  hardenedRuntime: false
  # Ad-hoc signature: required for Apple Silicon to run the app at all without a
  # Developer ID certificate (users still confirm the first launch; see README).
  identity: '-'
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  background: build/background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 205
    - x: 400
      y: 205
      type: link
      path: /Applications
linux:
  icon: build/icons
  category: Office
  synopsis: Family tree editor
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Jakub Kurc <jak.kurc@gmail.com>
  vendor: Jakub Kurc
  executableName: family-insight
  desktop:
    entry:
      Name: Family Insight
      Comment: Family tree editor
      Comment[pl]: Edytor drzewa genealogicznego
      Comment[de]: Stammbaum-Editor
      Comment[fr]: Éditeur d’arbre généalogique
      Comment[es]: Editor de árboles genealógicos
      Comment[it]: Editor di alberi genealogici
      Comment[pt]: Editor de árvores genealógicas
      Keywords: genealogy;family;tree;genealogia;rodzina;drzewo;Genealogie;Familie;Stammbaum;généalogie;famille;arbre;genealogía;familia;árbol;genealogia;famiglia;albero;genealogia;família;árvore;
      StartupWMClass: Family Insight
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
