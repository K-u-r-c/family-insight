name: Feature request / Propozycja funkcji
description: Suggest an idea for Ohara Tree.
labels: ['type/feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Problem
      description: What would you like to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / Proponowane rozwiązanie
