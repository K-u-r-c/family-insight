name: Bug report / Zgłoszenie błędu
description: Something does not work as expected.
labels: ['type/bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / Co się stało?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Kroki do odtworzenia
      placeholder: "1. ...\n2. ..."
  - type: input
    id: version
    attributes:
      label: App version and OS / Wersja aplikacji i system
      placeholder: 'v1.0.0, Windows 11'
